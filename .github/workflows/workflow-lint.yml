# =============================================================
# GitHub Actions Security Analysis with zizmor 🌈
# =============================================================

name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: ['main']

permissions: {}

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  zizmor:
    name: Run zizmor 🌈
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
