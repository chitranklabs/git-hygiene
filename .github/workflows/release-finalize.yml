name: Release 2 - Finalize Tag 🏷️

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to finalize (e.g. v0.5.0). Run against its release commit.'
        required: true

# Never interrupt a registry publish or run two releases at once.
concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize Release 🚀
    if: |
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')) ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'chitrank2050')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_ARTIFACTS: ${{ runner.temp }}/release-artifacts
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout release commit 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Validate release identity and credentials
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo '::error::NPM_TOKEN must be configured before releasing'; exit 1; }
          RELEASE_TAG="${INPUT_VERSION:-${BRANCH_NAME#chore/release-}}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected a stable vX.Y.Z release'; exit 1; }
          export RELEASE_TAG
          node scripts/release-artifacts.mjs check
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build packages and verify committed action
        run: |
          pnpm --filter @chitrank2050/git-hygiene-core build
          pnpm --filter @chitrank2050/git-hygiene build
          pnpm build:action
          git diff --exit-code -- dist/action.js
          pnpm test

      - name: Pack and test npm artifacts in a clean consumer
        run: node scripts/release-artifacts.mjs pack

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Validate JSR workspace without publishing
        run: deno publish --dry-run --allow-slow-types

      - name: Attest the artifacts being distributed
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-artifacts/*.tgz
            dist/action.js

      - name: Publish verified npm tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-artifacts.mjs publish-npm

      # Deno publishes core before its dependent CLI. Keep type checks and provenance enabled.
      - name: Publish JSR workspace
        run: deno publish --allow-slow-types

      - name: Create verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-artifacts.mjs check
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            # API failure stops the release; never fall back to a different identity.
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$(git rev-parse HEAD)"
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          node scripts/release-artifacts.mjs check

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Finalize public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.notes.outputs.content }}
        run: |
          set -euo pipefail
          # A failed create (including an existing release) requires explicit review, not overwrite.
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "$RELEASE_NOTES" "$RELEASE_ARTIFACTS"/*.tgz dist/action.js
